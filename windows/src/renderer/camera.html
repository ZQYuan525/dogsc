<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<title>摄像头预览</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* 预览窗只用于录制时看自己：它不进入录制画面，成片里的摄像头在编辑器里排版。 */
  .bubble { -webkit-app-region: drag; position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; background: #1b1c20; box-shadow: 0 0 0 3px #fff, 0 8px 22px rgba(0, 0, 0, 0.35); }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
</style>
<body>
  <div class="bubble"><video id="video" autoplay muted playsinline></video></div>
  <script>
    'use strict';
    const { ipcRenderer } = require('electron');
    const video = document.getElementById('video');
    let stream = null;
    async function open(deviceId) {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      const constraint = deviceId && deviceId !== 'default' ? { deviceId: { exact: deviceId } } : {};
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { ...constraint, width: { ideal: 1280 }, height: { ideal: 720 } } });
        video.srcObject = stream;
      } catch { /* 没有摄像头或被占用：保持深色占位 */ }
    }
    ipcRenderer.on('camera:device', (event, deviceId) => open(deviceId));
    open(new URLSearchParams(location.search).get('device'));
  </script>
</body>
</html>
